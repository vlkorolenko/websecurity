server:
  port: 8080

spring:
  application:
    name: docushield-backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/docushield_db}
      auto-index-creation: true

security:
  csrf:
    enabled: ${SECURITY_CSRF_ENABLED:false}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:3p83qbZ7/Aox0ApclnrhCvZaPDAY7hxkMHkByd6yezkgNOCTh29lbLG8SBYs20a3}
      expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.docushield: DEBUG
    org.springframework.security: DEBUG
